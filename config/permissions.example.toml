version = 2

[network]
claude = true
codex = false
local = false
weather = true
web = false

[local]
port = 8080

[system]
systemd = ["system", "user"]

[files]
read = []
write = []
deny = [
    "~/.ssh/",
    "~/.gnupg/",
    "~/.claude/",
    "~/.codex/",
    "~/.aws/",
    "~/.azure/",
    "~/.kube/",
    "~/.password-store/",
    "~/.docker/",
    "~/.netrc",
    "~/.git-credentials",
    "~/.npmrc",
    "~/.pypirc",
    "~/.env",
    "~/.config/gh/",
    "~/.config/gcloud/",
    "~/.config/rclone/",
    "~/.local/share/keyrings/",
    "~/.config/ai-desktop/",
    "~/.local/state/ai-desktop/",
    "~/.local/share/ai-desktop/",
]

[commands]
allow = [
    "systemd-analyze",
    "systemd-analyze blame",
    "systemd-analyze critical-chain",
    "systemd-analyze security --no-pager",
    "systemctl status <unit> --no-pager",
    "systemctl --failed --no-pager",
    "systemctl list-units --type=service --state=running --no-pager",
    "systemctl list-timers --no-pager",
    "systemctl is-active <unit>",
    "systemctl is-enabled <unit>",
    "journalctl --disk-usage",
    "uname -a",
    "uname -r",
    "uptime",
    "hostnamectl",
    "timedatectl",
    "localectl",
    "lsblk",
    "lsblk -f",
    "lscpu",
    "lsmem",
    "lspci",
    "lspci -k",
    "lsusb",
    "free -h",
    "sensors",
    "upower -d",
    "powerprofilesctl get",
    "vmstat 1 <int>",
    "nproc",
    "pacman -Qi <word>",
    "pacman -Qs <word>",
    "pacman -Qk <word>",
]

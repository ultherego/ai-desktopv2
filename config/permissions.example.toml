version = 2

[network]
claude = true
codex = false
weather = true
web = false

[system]
systemd = ["system", "user"]

[files]
read = []
write = []
deny = [
    "~/.ssh/",
    "~/.gnupg/",
    "~/.claude/",
    "~/.codex/",
    "~/.aws/",
    "~/.azure/",
    "~/.kube/",
    "~/.password-store/",
    "~/.docker/",
    "~/.netrc",
    "~/.git-credentials",
    "~/.npmrc",
    "~/.pypirc",
    "~/.env",
    "~/.config/gh/",
    "~/.config/gcloud/",
    "~/.config/rclone/",
    "~/.local/share/keyrings/",
    "~/.config/ai-desktop/",
    "~/.local/state/ai-desktop/",
    "~/.local/share/ai-desktop/",
]

[commands]
allow = [
    "systemd-analyze",
    "systemd-analyze blame",
    "systemd-analyze critical-chain",
    "systemd-analyze security --no-pager",
    "systemctl status <unit> --no-pager",
    "systemctl --failed --no-pager",
    "systemctl list-units --type=service --state=running --no-pager",
    "systemctl list-units --failed --no-pager",
    "systemctl list-timers --no-pager",
    "systemctl --user status <unit> --no-pager",
    "systemctl --user list-units --type=service --state=running --no-pager",
    "systemctl is-active <unit>",
    "systemctl is-enabled <unit>",
    "journalctl -b -p warning --no-pager -n <int>",
    "journalctl -b -p err --no-pager -n <int>",
    "journalctl -b -u <unit> --no-pager -n <int>",
    "journalctl -k -b --no-pager -n <int>",
    "journalctl --user -b -u <unit> --no-pager -n <int>",
    "journalctl --disk-usage",
    "dmesg --level=err,warn",
    "uname -a",
    "uname -r",
    "uptime",
    "hostnamectl",
    "timedatectl",
    "localectl",
    "lsblk",
    "lsblk -f",
    "lscpu",
    "lsmem",
    "lspci",
    "lspci -k",
    "lsusb",
    "lsmod",
    "free -h",
    "df -h",
    "df -i",
    "findmnt",
    "ip addr",
    "ip -br addr",
    "ip route",
    "ip link",
    "ss -tulpn",
    "ss -s",
    "nmcli general status",
    "nmcli device status",
    "nmcli connection show",
    "resolvectl status",
    "sensors",
    "ps",
    "ps aux",
    "ps -eo pid,user,comm,pcpu,pmem --sort=-pcpu",
    "ps -eo pid,user,comm,pcpu,pmem --sort=-pmem",
    "ps -eo pid,ppid,comm,etime",
    "pstree",
    "top -b -n 1",
    "vmstat 1 <int>",
    "iostat -x",
    "btrfs filesystem usage /",
    "btrfs filesystem show",
    "btrfs scrub status /",
    "snapper list",
    "snapper list-configs",
    "pacman -Q",
    "pacman -Qe",
    "pacman -Qi <word>",
    "pacman -Qs <word>",
    "pacman -Qu",
    "pacman -Qk <word>",
    "pactl info",
    "pactl list short sinks",
    "pactl list short sources",
    "wpctl status",
    "vulkaninfo --summary",
    "glxinfo -B",
    "bluetoothctl show",
    "bluetoothctl devices",
    "powerprofilesctl get",
    "upower -d",
    "docker ps",
    "docker images",
    "docker info",
    "nproc",
    "id",
    "who",
    "last -n <int>",
]
